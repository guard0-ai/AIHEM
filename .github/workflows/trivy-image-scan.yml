name: Trivy Image Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AIHEM is public, so it cannot `uses:` guard0-ai/.github's
# reusable-trivy-image-scan.yml. This inlines that workflow's steps and runs
# them per-image via a matrix (the reusable is one-image-per-call; multi-image
# repos call it once per image — replicated here). Keep the two in sync.
permissions:
  contents: read
  security-events: write # upload SARIF to Code Scanning
  # codeql-action/upload-sarif@v3 GETs the run via the Actions API on
  # private/internal repos; public repos (like AIHEM) don't need actions:read,
  # but it's kept for parity with the reusable workflow.
  actions: read

# Flip to 'true' to make any HIGH/CRITICAL finding fail the job (matches the
# reusable workflow's fail-on-findings input). Report-only for now: the base
# images and pinned deps carry pre-existing CVEs (mirrors dependency-review.yml).
env:
  FAIL_ON_FINDINGS: 'false'
  SEVERITY: 'HIGH,CRITICAL'

jobs:
  trivy:
    name: Trivy (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 7 buildable first-party images. frontend/admin-panel and
        # frontend/hackpad are intentionally excluded: they are commented out in
        # deploy/docker/docker-compose.yml and their Dockerfiles COPY a path
        # outside the build context (../web-app/package.json), so they can't build.
        image:
          - { name: web-app, context: frontend/web-app }
          - { name: agent-service, context: services/agent-service }
          - { name: auth-service, context: services/auth-service }
          - { name: challenge-validator, context: services/challenge-validator }
          - { name: chatbot-service, context: services/chatbot-service }
          - { name: model-registry, context: services/model-registry }
          - { name: rag-service, context: services/rag-service }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/Dockerfile
          push: false
          load: true
          tags: localhost/aihem-${{ matrix.image.name }}:pr-scan

      - name: Trivy image scan (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost/aihem-${{ matrix.image.name }}:pr-scan
          format: 'table'
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost/aihem-${{ matrix.image.name }}:pr-scan
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: ${{ env.SEVERITY }}
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          # Distinct category per image so later uploads don't overwrite earlier
          # ones in Code Scanning (the reusable workflow's sarif-category input).
          category: trivy-image-${{ matrix.image.name }}

      - name: Count findings + maybe fail
        if: always() && hashFiles('trivy-image.sarif') != ''
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy-image.sarif)
          echo "Trivy findings at ${{ env.SEVERITY }} severity: $count"
          if [ "${{ env.FAIL_ON_FINDINGS }}" = "true" ] && [ "$count" -gt 0 ]; then
            echo "::error::Trivy image scan found $count vulnerabilities at severity ${{ env.SEVERITY }} or above."
            exit 1
          fi
